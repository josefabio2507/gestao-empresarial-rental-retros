{% extends "base.html" %}

{% block content %}
<section class="page">
    <div class="top-bar">
        <div>
            {% if modo == "novo" %}
                <h1>Novo Colaborador</h1>
                <p>Cadastre um novo colaborador.</p>
            {% else %}
                <h1>Editar Colaborador</h1>
                <p>Atualize os dados do colaborador.</p>
            {% endif %}
        </div>
    </div>

    <form class="form-card" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="matricula">Matrícula</label>
                <input
                    type="text"
                    name="matricula"
                    id="matricula"
                    value="{{ colaborador.matricula if colaborador else '' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    name="nome"
                    id="nome"
                    value="{{ colaborador.nome if colaborador else '' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input
                    type="text"
                    name="cpf"
                    id="cpf"
                    value="{{ colaborador.cpf if colaborador else '' }}"
                    placeholder="Somente números ou com máscara"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    name="email"
                    id="email"
                    value="{{ colaborador.email if colaborador else '' }}"
                >
            </div>

            <div class="form-group">
                <label for="telefone">Telefone / WhatsApp</label>
                <input
                    type="text"
                    name="telefone"
                    id="telefone"
                    value="{{ colaborador.telefone if colaborador else '' }}"
                    placeholder="Ex: 5513999999999"
                >
                <small>Recomendado: 55 + DDD + número.</small>
            </div>

            <div class="form-group">
                <label for="cargo">Cargo</label>
                <select name="cargo" id="cargo">
                    <option value="">Selecione...</option>

                    {% set cargo_atual = colaborador.cargo.strip() if colaborador and colaborador.cargo else "" %}
                    {% set cargos_ativos_nomes = cargos | map(attribute="nome") | map("lower") | list %}
                    {% if cargo_atual and cargo_atual.lower() not in cargos_ativos_nomes %}
                        <option value="{{ cargo_atual }}" selected>
                            {{ cargo_atual }} (inativo)
                        </option>
                    {% endif %}

                    {% for cargo in cargos %}
                        <option
                            value="{{ cargo.nome }}"
                            {% if cargo_atual.lower() == cargo.nome.lower() %}selected{% endif %}
                        >
                            {{ cargo.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="equipe_id">Equipe</label>
                <select name="equipe_id" id="equipe_id" required>
                    <option value="">Selecione...</option>

                    {% for equipe in equipes %}
                        <option
                            value="{{ equipe.id }}"
                            {% if colaborador and colaborador.equipe_id == equipe.id %}selected{% endif %}
                        >
                            {{ equipe.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="vale_transporte_optante">Optante Vale Transporte</label>
                <select name="vale_transporte_optante" id="vale_transporte_optante">
                    <option
                        value="nao_optante"
                        {% if not colaborador or not colaborador.vale_transporte_optante %}selected{% endif %}
                    >
                        Não Optante
                    </option>
                    <option
                        value="optante"
                        {% if colaborador and colaborador.vale_transporte_optante %}selected{% endif %}
                    >
                        Optante
                    </option>
                </select>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input
                        type="checkbox"
                        name="ativo"
                        {% if not colaborador or colaborador.ativo %}checked{% endif %}
                    >
                    Colaborador ativo
                </label>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Salvar</button>
            <a class="btn btn-secondary" href="{{ url_for('colaboradores.listar_colaboradores') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}

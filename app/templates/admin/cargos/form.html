{% extends "base.html" %}

{% block content %}
<section class="page">
    <div class="top-bar">
        <div>
            <span class="page-kicker">Administração</span>
            <h1>{{ "Novo Cargo" if modo == "novo" else "Editar Cargo" }}</h1>
            <p>
                {{ "Cadastre um novo cargo para uso no sistema." if modo == "novo" else "Atualize o nome do cargo selecionado." }}
            </p>
        </div>
    </div>

    <form class="form-card" method="POST">
        <div class="form-group">
            <label for="nome">Nome</label>
            <input
                type="text"
                name="nome"
                id="nome"
                value="{{ nome_informado }}"
                maxlength="120"
                required
                autofocus
            >
        </div>

        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Salvar</button>
            <a class="btn btn-secondary" href="{{ url_for('cargos.listar_cargos') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}

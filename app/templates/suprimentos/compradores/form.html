{% extends "base.html" %}

{% block content %}
<section class="page">
    <div class="top-bar">
        <div>
            <span class="page-kicker">Suprimentos</span>
            <h1>{{ "Novo Comprador" if modo == "novo" else "Editar Comprador" }}</h1>
            <p>Informe o telefone que recebera as requisicoes abertas.</p>
        </div>
        <a class="btn btn-secondary" href="{{ url_for('suprimentos_compradores.listar') }}">Voltar</a>
    </div>

    <form class="form-card" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="usuario_comprador_id">Usuario vinculado</label>
                <select id="usuario_comprador_id" name="usuario_comprador_id">
                    <option value="">Sem vinculo</option>
                    {% for usuario in usuarios %}
                        <option value="{{ usuario.id }}" {{ "selected" if comprador and comprador.usuario_comprador_id == usuario.id else "" }}>{{ usuario.nome }} - {{ usuario.email }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" required maxlength="120" value="{{ comprador.nome if comprador else '' }}" data-uppercase>
            </div>
            <div class="form-group">
                <label for="telefone_whatsapp">Telefone WhatsApp</label>
                <input id="telefone_whatsapp" name="telefone_whatsapp" type="text" inputmode="tel" required value="{{ comprador.telefone_whatsapp if comprador else '' }}" placeholder="55DDDNUMERO">
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" maxlength="150" value="{{ comprador.email if comprador and comprador.email else '' }}">
            </div>
            <div class="form-group">
                <label for="centro_custo_id">Centro de custo</label>
                <select id="centro_custo_id" name="centro_custo_id">
                    <option value="">Todos</option>
                    {% for centro in centros_custo %}
                        <option value="{{ centro.id }}" {{ "selected" if comprador and comprador.centro_custo_id == centro.id else "" }}>{{ centro.codigo or "-" }} - {{ centro.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="ativo">Status</label>
                <label class="checkbox-line">
                    <input id="ativo" name="ativo" type="checkbox" {{ "checked" if not comprador or comprador.ativo else "" }}>
                    Comprador ativo
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="observacoes">Observacoes</label>
            <textarea id="observacoes" name="observacoes" rows="3" data-uppercase>{{ comprador.observacoes if comprador else "" }}</textarea>
        </div>

        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Salvar</button>
            <a class="btn btn-secondary" href="{{ url_for('suprimentos_compradores.listar') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}

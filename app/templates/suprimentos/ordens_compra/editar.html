{% extends "base.html" %}

{% block content %}
<section class="page">
    <div class="top-bar">
        <div>
            <span class="page-kicker">Suprimentos</span>
            <h1>Editar {{ ordem.numero }}</h1>
            <p>Atualize a classificação e as observações da ordem de compra.</p>
        </div>
        <a class="btn btn-secondary" href="{{ url_for('suprimentos_ordens_compra.detalhes', ordem_id=ordem.id) }}">Voltar</a>
    </div>

    <form class="form-card" method="POST">
        <div class="form-group">
            <label for="tipo_custo">Tipo de custo</label>
            <select id="tipo_custo" name="tipo_custo">
                <option value="">Não informado</option>
                {% for tipo in ["Abastecimento", "Diversos", "Manutenção"] %}
                    <option value="{{ tipo }}" {% if ordem.tipo_custo == tipo %}selected{% endif %}>{{ tipo }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="observacoes">Observações</label>
            <textarea id="observacoes" name="observacoes" data-uppercase>{{ ordem.observacoes or "" }}</textarea>
        </div>
        <p class="form-help">Itens, fornecedor e valores permanecem vinculados à cotação aprovada.</p>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Salvar</button>
            <a class="btn btn-secondary" href="{{ url_for('suprimentos_ordens_compra.detalhes', ordem_id=ordem.id) }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}

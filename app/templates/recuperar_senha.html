<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recuperar senha | Gestão Empresarial Rental Retros</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="{{ url_for('static', filename='img/logo-rental-retros.png') }}" alt="Rental Retros">
            </div>

            <h1>Recuperar senha</h1>
            <p>Informe seu e-mail cadastrado para receber as instruções de recuperação.</p>

            {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% if mensagens %}
                    <div class="flash-area">
                        {% for categoria, mensagem in mensagens %}
                            <div class="flash flash-{{ categoria }}">
                                {{ mensagem }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.esqueci_senha') }}">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        Enviar instruções
                    </button>
                </div>
            </form>

            <div class="login-help">
                <a href="{{ url_for('auth.login') }}">Voltar ao login</a>
            </div>
        </div>
    </div>
</body>
</html>

{% extends "base.html" %}

{% block content %}
<section class="page">
    <div class="top-bar">
        <div>
            <span class="page-kicker">Pool de Veiculos</span>
            <h1>Vincular Responsavel</h1>
            <p>{{ veiculo.identificacao }} - {{ veiculo.descricao }}</p>
        </div>
    </div>

    <form class="form-card" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label>Motorista/operador</label>
                <input value="{{ colaborador.nome }}" readonly>
                <input type="hidden" name="colaborador_id" value="{{ colaborador.id }}">
            </div>
            <div class="form-group">
                <label>Equipe</label>
                <input value="{{ equipe.nome if equipe else 'Sem equipe vinculada' }}" readonly>
                <input type="hidden" name="equipe_id" value="{{ equipe.id if equipe else '' }}">
            </div>
            <div class="form-group">
                <label for="tipo_leitura">Tipo de leitura</label>
                <select id="tipo_leitura" name="tipo_leitura" required>
                    <option value="">Selecione</option>
                    {% for tipo in tipos_leitura %}
                        <option value="{{ tipo }}">{{ tipo }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="leitura_inicial">Leitura inicial</label>
                <input id="leitura_inicial" name="leitura_inicial" required>
            </div>
            <div class="form-group">
                <label>Leitura final do responsavel anterior</label>
                <input value="{{ leitura_final_anterior if leitura_final_anterior is not none else '' }}" readonly>
                <input type="hidden" name="leitura_final_anterior" value="{{ leitura_final_anterior if leitura_final_anterior is not none else '' }}">
            </div>
            <div class="form-group">
                <label for="observacoes">Observacoes</label>
                <textarea id="observacoes" name="observacoes"></textarea>
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Criar vinculo</button>
            <a class="btn btn-secondary" href="{{ url_for('operacao.pool') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}

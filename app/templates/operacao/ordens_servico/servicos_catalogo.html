{% extends "base.html" %}{% block content %}<section class="page"><div class="top-bar"><div><span class="page-kicker">Operação</span><h1>Cadastro de Serviços</h1><p>Serviços disponíveis para os diários de produção.</p></div></div><div class="top-bar-actions"><a class="btn btn-secondary" href="{{ url_for('departamentos.detalhe_departamento', slug_departamento='operacao') }}">Voltar</a></div><form class="details-card" method="post"><div class="form-group"><label>Nome do serviço *</label><input name="nome" class="texto-maiusculo" required></div><div class="form-actions"><button class="btn btn-primary">Cadastrar</button></div></form><div class="details-card"><h2>Serviços cadastrados</h2><div style="max-height:340px;overflow-y:auto">{% for item in servicos if item.ativo %}<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #e5e7eb"><span style="flex:1">{{ item.nome }}</span><span style="display:flex;gap:6px"><a class="btn btn-secondary" href="?editar_id={{ item.id }}">Editar</a><form method="post" action="{{ url_for('ordens_servico.excluir_servico_catalogo', servico_id=item.id) }}"><button class="btn btn-secondary">Excluir</button></form></span></div>{% else %}<p>Nenhum serviço cadastrado.</p>{% endfor %}</div></div></section><script>document.querySelectorAll('.texto-maiusculo').forEach(c=>c.addEventListener('input',()=>c.value=c.value.toUpperCase()));</script>{% endblock %}

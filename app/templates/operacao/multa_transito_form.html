{% extends "base.html" %}

{% block content %}
<section class="page">
    <div class="top-bar">
        <div>
            <span class="page-kicker">Multas de Trânsito</span>
            <h1>Nova notificação de multa</h1>
            <p>Primeiro, cadastre os dados recebidos na notificação. O boleto será informado na próxima etapa.</p>
        </div>
        <a class="btn btn-secondary" href="{{ url_for('operacao.multas_transito') }}">Voltar</a>
    </div>

    <form class="form-card" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="data_infracao">Data da Infração</label>
                <input id="data_infracao" name="data_infracao" type="date" required value="{{ dados.get('data_infracao', '') }}">
            </div>
            <div class="form-group">
                <label for="hora_infracao">Hora da Infração</label>
                <input id="hora_infracao" name="hora_infracao" type="time" required value="{{ dados.get('hora_infracao', '') }}">
            </div>
            <div class="form-group">
                <label for="veiculo_id">Placa do veículo</label>
                <select id="veiculo_id" name="veiculo_id" required>
                    <option value="">Selecione</option>
                    {% for veiculo in veiculos %}
                        <option value="{{ veiculo.id }}" data-descricao="{{ veiculo.descricao }}" {% if dados.get('veiculo_id') == veiculo.id|string %}selected{% endif %}>{{ veiculo.placa or veiculo.identificacao }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Descrição do Veículo</label>
                <input id="descricao_veiculo" readonly value="">
            </div>
            <div class="form-group">
                <label for="numero_auto_infracao">Nº Auto de infração</label>
                <input id="numero_auto_infracao" name="numero_auto_infracao" required value="{{ dados.get('numero_auto_infracao', '') }}">
            </div>
            <div class="form-group">
                <label for="local_infracao">Local da Infração</label>
                <input id="local_infracao" name="local_infracao" required value="{{ dados.get('local_infracao', '') }}">
            </div>
            <div class="form-group">
                <label for="cidade">Cidade</label>
                <select id="cidade" name="cidade" required>
                    <option value="">Selecione</option>
                    {% for valor, nome in cidades %}
                        <option value="{{ valor }}" {% if dados.get('cidade') == valor %}selected{% endif %}>{{ nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group form-group-wide">
                <label for="descricao_infracao">Descrição da Infração</label>
                <textarea id="descricao_infracao" name="descricao_infracao" required>{{ dados.get('descricao_infracao', '') }}</textarea>
            </div>
            <div class="form-group">
                <label>Motorista Vinculado</label>
                <input id="motorista_vinculado" readonly value="Calculado pela data da infração">
            </div>
            <div class="form-group">
                <label for="motorista_indicado_nome">Motorista indicado</label>
                <input id="motorista_indicado_nome" name="motorista_indicado_nome" value="{{ dados.get('motorista_indicado_nome', '') }}" placeholder="Nome do condutor indicado">
            </div>
            <div class="form-group">
                <label for="gravidade">Gravidade</label>
                <select id="gravidade" name="gravidade" required>
                    <option value="">Selecione</option>
                    {% for valor, nome in gravidades %}
                        <option value="{{ valor }}" {% if dados.get('gravidade') == valor %}selected{% endif %}>{{ nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="pontuacao">Pontuação</label>
                <input id="pontuacao" name="pontuacao" type="number" min="0" required value="{{ dados.get('pontuacao', '') }}">
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Salvar notificação e continuar</button>
            <a class="btn btn-secondary" href="{{ url_for('operacao.multas_transito') }}">Cancelar</a>
        </div>
    </form>
</section>
<script>
(function () {
    const veiculo = document.getElementById('veiculo_id');
    const descricao = document.getElementById('descricao_veiculo');
    const data = document.getElementById('data_infracao');
    const hora = document.getElementById('hora_infracao');
    const motorista = document.getElementById('motorista_vinculado');

    function atualizarDescricao() {
        const option = veiculo.options[veiculo.selectedIndex];
        descricao.value = option ? (option.dataset.descricao || '') : '';
    }

    function atualizarMotorista() {
        if (!veiculo.value || !data.value || !hora.value) {
            motorista.value = 'Calculado pela data da infração';
            return;
        }
        const params = new URLSearchParams({ veiculo_id: veiculo.value, data_infracao: data.value, hora_infracao: hora.value });
        fetch(`{{ url_for('operacao.motorista_vinculado_multa') }}?${params.toString()}`)
            .then(response => response.json())
            .then(payload => { motorista.value = payload.nome; })
            .catch(() => { motorista.value = 'Não foi possível consultar'; });
    }

    veiculo.addEventListener('change', function () { atualizarDescricao(); atualizarMotorista(); });
    data.addEventListener('change', atualizarMotorista);
    hora.addEventListener('change', atualizarMotorista);
    atualizarDescricao();
    atualizarMotorista();
})();
</script>
{% endblock %}

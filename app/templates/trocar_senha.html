{% extends "base.html" %}

{% block content %}
<section class="login-page">
    <div class="login-card">
        <h1>Troca obrigatória de senha</h1>
        <p>Para continuar usando o sistema, crie uma nova senha de acesso.</p>

        <form method="POST">
            <div class="form-group">
                <label for="nova_senha">Nova senha</label>
                <input
                    type="password"
                    name="nova_senha"
                    id="nova_senha"
                    required
                    minlength="6"
                >
            </div>

            <div class="form-group">
                <label for="confirmar_senha">Confirmar nova senha</label>
                <input
                    type="password"
                    name="confirmar_senha"
                    id="confirmar_senha"
                    required
                    minlength="6"
                >
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">
                    Alterar senha
                </button>

                <a class="btn btn-secondary" href="{{ url_for('auth.logout') }}">
                    Sair
                </a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
